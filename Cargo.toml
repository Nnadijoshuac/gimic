[package]
name = "solana-wallet-diligence"
version = "0.2.0"
edition = "2021"
description = "Read-only Solana wallet due-diligence engine — the reference profiler behind the ZeroClaw wallet-diligence skill."
license = "MIT"
authors = ["Nnadijoshuac"]
repository = "https://github.com/Nnadijoshuac/gimic"

[lib]
# cdylib → the optional Tier-3 wasm component; rlib → the native reference
# profiler used by the examples/tests and to generate sample reports.
crate-type = ["cdylib", "rlib"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Native-only HTTP transport for the reference profiler (examples + sample-report
# generation). The wasm component uses waki over wasi:http instead (below).
[target.'cfg(not(target_family = "wasm"))'.dependencies]
ureq = "2"

# wasm-only: the optional Tier-3 plugin. WIT bindings (export side) + the HTTP
# client that contributes the gated wasi:http import (import side).
[target.'cfg(target_family = "wasm")'.dependencies]
wit-bindgen = "0.41"
waki = "0.5"

[profile.release]
opt-level = "s"
lto = true
strip = true
codegen-units = 1
